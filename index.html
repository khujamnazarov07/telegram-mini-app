<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Asmo ul-Husna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header id="hdr" class="hdr" dir="ltr">
    <a class="brand" id="home" href="./" aria-label="Asmo ul-Husna">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3cc29a"/><stop offset="1" stop-color="#136b55"/></linearGradient></defs>
        <rect width="40" height="40" rx="12" fill="url(#lg)"/>
        <g class="star" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round">
          <rect x="11.5" y="11.5" width="17" height="17" rx="1.5"/>
          <rect x="11.5" y="11.5" width="17" height="17" rx="1.5" transform="rotate(45 20 20)"/>
        </g>
        <circle cx="20" cy="20" r="2.8" fill="#f5d36b"/>
      </svg>
      <span class="bt"><span class="b1">Asmo <em>ul-Husna</em></span><span class="b2">الأسماء الحسنى</span></span>
    </a>
    <div class="tools">
      <div id="wLang" class="wheel w-lang" role="listbox" aria-label="Language"></div>
      <div id="wTheme" class="wheel w-theme" role="listbox" aria-label="Theme"></div>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="nav"></nav>
  <div id="toast" class="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
