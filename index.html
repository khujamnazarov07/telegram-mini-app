  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; -webkit-backdrop-filter: blur(30px) saturate(1.8) brightness(1.05); backdrop-filter: blur(30px) saturate(1.8) brightness(1.05); background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 40%, rgba(255,255,255,.2) 72%, rgba(255,255,255,.04)), rgba(238, 242, 238, .14); pointer-events: none; }
    #splash.d { background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 40%, rgba(255,255,255,.08) 72%, rgba(255,255,255,.01)), rgba(14, 18, 16, .2); }
    #splash.mf { background-color: rgba(250, 224, 232, .16); }
    #splash.mf.d { background-color: rgba(40, 24, 33, .22); }
    #splash.mm { background-color: rgba(228, 232, 240, .16); }

  </style>

<body>
  <div id="splash" aria-hidden="true"></div>
  <header id="hdr" class="hdr" dir="ltr">
    <a class="brand" id="home" role="button" tabindex="0" aria-label="Asmo ul-Husna" draggable="false">
      <span class="emb sm" aria-hidden="true"><i class="lgo"></i><i class="lgo b"></i></span>
      <span class="bt"><span class="b1">Asmo <em>ul-Husna</em></span><span class="b2">الأسماء الحسنى</span></span>
    </a>
    <div class="tools">
      <div id="wLang" class="wheel w-lang" role="listbox" aria-label="Language"></div>

  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="nav"></nav>
  <div id="toast" class="toast" role="status"></div>
    <script>
    (function () {
      var sp = document.getElementById("splash"), em = document.querySelector("#home .emb")
      if (!sp) return
      var dark = false, gen = ""
      try {
        var st = JSON.parse(localStorage.getItem("asmo_miniapp_v1") || "{}")
        dark = st.theme === "dark" || (st.theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        gen = st.gender === "female" ? "mf" : st.gender === "male" ? "mm" : ""
        var fem = st.gender === "female", male = st.gender === "male"
        var gl = fem ? (st.fgl == null ? 100 : st.fgl) : (st.mgl == null ? 100 : st.mgl), bl = fem ? (st.fbl == null ? 2 : st.fbl) : (st.mbl == null ? 2 : st.mbl)
        var gon = fem ? st.fgon !== false : male ? st.mgon === true : true
        var gk = 1.65 - gl / 100 * 1.3, bk = bl / 9, ss = sp.style
        if (gon) {
          var wa = dark ? [.14, .04, .08] : [.42, .14, .26]
          var bf = "blur(" + Math.max(2, 26 * bk).toFixed(1) + "px) saturate(1.6)"
          ss.webkitBackdropFilter = bf; ss.backdropFilter = bf
          ss.background = "linear-gradient(135deg, rgba(255,255,255," + (wa[0] * gk).toFixed(3) + "), rgba(255,255,255," + (wa[1] * gk).toFixed(3) + ") 45%, rgba(255,255,255," + (wa[2] * gk).toFixed(3) + "))"
        }
      } catch (e) {}
      if (gen) sp.classList.add(gen)
      if (dark) sp.classList.add("d")
      function kill() { if (sp.parentNode) sp.parentNode.removeChild(sp) }
      var rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches
      if (rm || !em || !em.getBoundingClientRect || !(window.CSS && CSS.supports && (CSS.supports("mask-composite", "intersect") || CSS.supports("-webkit-mask-composite", "source-in")))) {
        setTimeout(function () { sp.style.transition = "opacity .25s"; sp.style.opacity = "0"; setTimeout(kill, 280) }, 250); return
      }
      var vw = window.innerWidth, vh = window.innerHeight, r = em.getBoundingClientRect(), p = 1
      var x = r.left - p, y = r.top - p, w = r.width + 2 * p, h = r.height + 2 * p, rr = Math.min(w, h) * 0.26
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2, diag = Math.sqrt(vw * vw + vh * vh) + 120
      var d = "M0 0H" + vw + "V" + vh + "H0Z M" + (x + rr) + " " + y + "H" + (x + w - rr) + "A" + rr + " " + rr + " 0 0 1 " + (x + w) + " " + (y + rr) + "V" + (y + h - rr) + "A" + rr + " " + rr + " 0 0 1 " + (x + w - rr) + " " + (y + h) + "H" + (x + rr) + "A" + rr + " " + rr + " 0 0 1 " + x + " " + (y + h - rr) + "V" + (y + rr) + "A" + rr + " " + rr + " 0 0 1 " + (x + rr) + " " + y + "Z"
      var hole = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="' + vw + '" height="' + vh + '"><path fill-rule="evenodd" d="' + d + '"/></svg>') + '")'
      var S = sp.style
      S.webkitMaskSize = "100% 100%"; S.maskSize = "100% 100%"
      S.webkitMaskRepeat = "no-repeat"; S.maskRepeat = "no-repeat"
      function setMask(R) {
        var m = R < 0 ? hole : "radial-gradient(circle at " + cx + "px " + cy + "px, transparent " + R + "px, #000 " + (R + 90) + "px), " + hole
        S.webkitMaskImage = m; S.maskImage = m
        S.webkitMaskComposite = "source-in"; S.maskComposite = "intersect"
      }
      setMask(-1)
      var t0 = Date.now(), started = false
      function reveal() {
        var s0 = performance.now(), D = 520
        function f(ts) {
          var q = Math.min(1, (ts - s0) / D), e = 1 - Math.pow(1 - q, 2.2)
          setMask(e * diag)
          if (q < 1) requestAnimationFrame(f); else kill()
        }
        requestAnimationFrame(f)
      }
      function tick() {
        if (started) return
        var el = Date.now() - t0
        if ((window.__asmoReady && el >= 280) || el >= 1100) { started = true; reveal() } else setTimeout(tick, 30)
      }
      tick()
    })()
  </script>
