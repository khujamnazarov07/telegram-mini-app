<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>Asmaul Husna Robot</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- OY -->
    <div class="moon">🌙</div>

    <!-- SALOM -->
    <h1 id="greeting">
      Assalomu alaykum, botga xush kelibsiz
    </h1>

    <div class="divider"></div>

    <!-- ASMAUL HUSNA -->
    <div class="husna-card">

      <div class="husna-title">
        ✨ Asmaul Husna
      </div>

      <div class="husna-subtitle" id="subtitle">
        📿 Allohning 99 go'zal ismi
      </div>

      <div class="husna-tagline" id="tagline">
        🕊 Qalbingizga yaqinlashish yo'lida
      </div>

    </div>

    <div class="divider second"></div>

    <!-- ISMLAR -->
    <button class="btn names" data-action="names">
      📖 <span id="names">Ismlar</span>
    </button>

    <!-- 3 TA -->
    <div class="buttons-three">

      <button class="btn" data-action="favs">
        ❤️ <span id="favs">Sevimlilar</span>
      </button>

      <button class="btn" data-action="video">
        🎬 <span id="video">Video</span>
      </button>

      <button class="btn" data-action="search">
        🔍 <span id="search">Qidirish</span>
      </button>

    </div>

    <!-- 2 TA -->
    <div class="buttons-two">

      <button class="btn danger" data-action="help">
        ❔ <span id="help">Yordam</span>
      </button>

      <button class="btn danger" data-action="settings">
        ⚙️ <span id="settings">Sozlamalar</span>
      </button>

    </div>

    <div id="message"></div>

  </main>

  <script src="app.js"></script>

</body>
</html>
