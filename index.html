<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asmaul Husna Robot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f1721;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Top Action Bar Buttons */
        .row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-green {
            background-color: #2b7d38;
        }

        .btn-blue {
            background-color: #3b5088;
        }

        .btn-red {
            background-color: #9d3b3e;
        }

        /* Main Post Card */
        .card {
            background-color: #1e2c3a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-image {
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card-image img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bismillah {
            text-align: center;
            font-size: 14px;
            color: #a0acb6;
        }

        .greeting {
            font-size: 15px;
            font-weight: 500;
        }

        /* Quote Box */
        .quote-box {
            background-color: #16212d;
            border-left: 3px solid #63b3ed;
            padding: 10px 12px;
            border-radius: 4px;
            position: relative;
            font-size: 13px;
        }

        .quote-title {
            color: #63b3ed;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .quote-text {
            color: #d1d5db;
            font-style: italic;
            line-height: 1.4;
        }

        .quote-icon {
            position: absolute;
            right: 10px;
            top: 10px;
            color: #4a5568;
        }

        .timestamp {
            align-self: flex-end;
            font-size: 11px;
            color: #6c7883;
            margin-top: 4px;
        }

        /* Responsive Grid Adjustments */
        .col-2 {
            flex: 1;
        }

        .col-3 {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="chat-container">

    <!-- Top Rating Buttons -->
    <div class="row">
        <button class="btn btn-green col-2" onclick="handleAction('like')">👍</button>
        <button class="btn btn-blue col-2" onclick="handleAction('dislike')">👎</button>
    </div>

    <!-- Home Button -->
    <div class="row">
        <button class="btn btn-blue" onclick="handleAction('home')">🏡</button>
    </div>

    <!-- Main Content Card -->
    <div class="card">
        <div class="card-image">
            <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="100" y="20" width="113" height="113" transform="rotate(45 100 20)" stroke="#13752c" stroke-width="8"/>
                <text x="100" y="105" fill="#13752c" font-size="22" font-weight="bold" text-anchor="middle" direction="rtl">أسماء الله الحسنى</text>
            </svg>
        </div>
        <div class="card-content">
            <div class="bismillah">﷽</div>
            <div class="greeting">🌙 Assalomu alaykum, botga xush kelibsiz</div>
            
            <div class="quote-box">
                <div class="quote-title">✨ Asmaul Husna</div>
                <div class="quote-text">🌸 Allohning 99 go'zal ismi</div>
                <div class="quote-text">🕊️ Qalbingizga yaqinlashish yo'lida</div>
                <span class="quote-icon">❞</span>
            </div>

            <div class="timestamp">tahrirlangan 14:21</div>
        </div>
    </div>

    <!-- Main Navigation Buttons -->
    <div class="row">
        <button class="btn btn-green" onclick="handleAction('ismlar')">📖 Ismlar</button>
    </div>

    <div class="row">
        <button class="btn btn-blue col-3" onclick="handleAction('sevolilar')">❤️ Sevimlilar</button>
        <button class="btn btn-blue col-3" onclick="handleAction('video')">🎬 Video</button>
        <button class="btn btn-blue col-3" onclick="handleAction('qidirish')">🔍 Qidirish</button>
    </div>

    <div class="row">
        <button class="btn btn-red col-2" onclick="handleAction('yordam')">❓ Yordam</button>
        <button class="btn btn-red col-2" onclick="handleAction('sozlamalar')">⚙️ Sozlamalar</button>
    </div>

</div>

<script>
    function handleAction(actionName) {
        alert("Bosilgan bo'lim: " + actionName);
    }
</script>

</body>
</html>
