  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; -webkit-backdrop-filter: blur(46px) saturate(1.9) brightness(1.06); backdrop-filter: blur(46px) saturate(1.9) brightness(1.06); background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 38%, rgba(255,255,255,.3) 70%, rgba(255,255,255,.08)), rgba(238, 242, 238, .38); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), inset 0 1px 0 rgba(255,255,255,.7); }
    #splash.d { background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.03) 38%, rgba(255,255,255,.12) 70%, rgba(255,255,255,.02)), rgba(14, 18, 16, .42); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), inset 0 1px 0 rgba(255,255,255,.3); }
    #splash.mf { background-color: rgba(250, 224, 232, .34); }
    #splash.mf.d { background-color: rgba(40, 24, 33, .45); }
    #splash.mm { background-color: rgba(228, 232, 240, .34); }
    #splash.mm.d { background-color: rgba(10, 12, 18, .5); }
    .sbrand { position: fixed !important; z-index: 10000; margin: 0 !important; pointer-events: none; will-change: transform; }
  </style>

<body>
  <div id="splash" aria-hidden="true"></div>
  <header id="hdr" class="hdr" dir="ltr">
    <a class="brand" id="home" role="button" tabindex="0" aria-label="Asmo ul-Husna" draggable="false">
      <span class="emb sm" aria-hidden="true"><i class="lgo"></i><i class="lgo b"></i></span>
      <span class="bt"><span class="b1">Asmo <em>ul-Husna</em></span><span class="b2">الأسماء الحسنى</span></span>
    </a>
    <div class="tools">
      <div id="wLang" class="wheel w-lang" role="listbox" aria-label="Language"></div>
      <div id="wTheme" class="wheel w-theme" role="listbox" aria-label="Theme"></div>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" class="nav"></nav>
  <div id="toast" class="toast" role="status"></div>
    <script>
    (function () {
      var sp = document.getElementById("splash"), br = document.getElementById("home")
      if (!sp || !br) return
      var dark = false, gen = ""
      try {
        var st = JSON.parse(localStorage.getItem("asmo_miniapp_v1") || "{}")
        dark = st.theme === "dark" || (st.theme !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        gen = st.gender === "female" ? "mf" : st.gender === "male" ? "mm" : ""
      } catch (e) {}
      if (gen) sp.classList.add(gen)
      if (dark) sp.classList.add("d")
      var rm = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches
      function kill() { if (sp.parentNode) sp.parentNode.removeChild(sp); br.style.visibility = "" }
      if (rm || !br.getBoundingClientRect) { setTimeout(function () { sp.style.transition = "opacity .25s"; sp.style.opacity = "0"; setTimeout(kill, 280) }, 200); return }
      var r = br.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight
      var cl = br.cloneNode(true)
      cl.removeAttribute("id"); cl.className = "brand sbrand"
      cl.style.left = r.left + "px"; cl.style.top = r.top + "px"; cl.style.width = r.width + "px"; cl.style.height = r.height + "px"
      var dx = vw / 2 - (r.left + r.width / 2), dy = vh / 2 - (r.top + r.height / 2)
      cl.style.transform = "translate(" + dx + "px," + dy + "px)"
      document.body.appendChild(cl)
      br.style.visibility = "hidden"
      var t0 = Date.now(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, diag = Math.sqrt(vw * vw + vh * vh) + 120
      function reveal() {
        var s0 = performance.now(), D = 520
        function f(ts) {
          var p = Math.min(1, (ts - s0) / D), e = 1 - Math.pow(1 - p, 2.2), R = e * diag
          var m = "radial-gradient(circle at " + cx + "px " + cy + "px, transparent " + R + "px, #000 " + (R + 80) + "px)"
          sp.style.webkitMaskImage = m; sp.style.maskImage = m
          if (p < 1) requestAnimationFrame(f); else kill()
        }
        requestAnimationFrame(f)
      }
      function go() {
        cl.style.transition = "transform 380ms cubic-bezier(.2,.9,.2,1)"; cl.style.transform = "none"
        setTimeout(reveal, 170)
        setTimeout(function () { br.style.visibility = ""; if (cl.parentNode) cl.parentNode.removeChild(cl) }, 400)
      }
      var started = false
      function tick() {
        if (started) return
        var el = Date.now() - t0
        if ((window.__asmoReady && el >= 200) || el >= 1100) { started = true; go() } else setTimeout(tick, 30)
      }
      tick()
    })()
  </script>
  <script src="config.js?v=70" defer></script>
  <script src="data.js" defer></script>
  <script src="app.js?v=84" defer></script>
</body>
